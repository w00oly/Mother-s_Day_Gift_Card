<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>母親節快樂！</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #fce4ec; /* 溫柔的粉紅色背景，與您的圖片很搭 */
            font-family: 'Microsoft JhengHei', sans-serif;
            overflow: hidden;
        }
        h1 {
            color: #d81b60;
            margin-bottom: 20px;
            text-align: center;
            font-size: 1.8rem;
        }
        /* 修改這裡：適應橫式風景照的比例 */
        .scratch-container {
            position: relative;
            width: 90%; /* 讓它在手機上能自適應寬度 */
            max-width: 640px; /* 電腦上最大寬度 */
            aspect-ratio: 16 / 9; /* 強制保持橫式 16:9 的完美比例 */
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
            overflow: hidden;
            background-color: #fff;
        }
        .content {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-end; /* 將文字框推到下方 */
            /* 修改這裡：換成您的 JPG 圖片 */
            background-image: url('Dreamy Starry Prince (1).png'); 
            background-size: cover;
            background-position: center;
        }
        /* 稍微縮小文字框並增加透明度，以免擋住漂亮的背景 */
        .message-box {
            background: rgba(255, 255, 255, 0.75);
            padding: 10px 20px;
            border-radius: 10px;
            text-align: center;
            margin-bottom: 15px;
            box-shadow: 0 4px 10px rgba(216, 27, 96, 0.1);
        }
        .message-box p {
            margin: 5px 0;
            color: #d81b60; /* 文字配合主題改成深粉紅色 */
            font-weight: bold;
            font-size: 1.1em;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <h1>✨ 刮開螢幕領取驚喜 ✨</h1>

    <div class="scratch-container">
        <div class="content">
            <div class="message-box">
                <p>媽咪，母親節快樂！</p>
                <p>謝謝您一直以來的照顧❤️</p>
            </div>
        </div>
        <canvas id="scratchCanvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('scratchCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.querySelector('.scratch-container');

        // 設定 Canvas 解析度與顯示尺寸一致
        canvas.width = container.offsetWidth;
        canvas.height = container.offsetHeight;

        // 繪製刮刮卡灰色遮罩
        ctx.fillStyle = '#b0bec5';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 加上提示文字
        ctx.font = 'bold 24px "Microsoft JhengHei"';
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('✨ 用手指抹開這裡 ✨', canvas.width / 2, canvas.height / 2);

        // 刮開的設定
        let isDrawing = false;
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';
        ctx.lineWidth = Math.min(canvas.width, canvas.height) * 0.15; // 根據螢幕大小動態調整刮痕粗細

        // 取得座標
        function getCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            if (e.type.includes('touch')) {
                return {
                    x: e.touches[0].clientX - rect.left,
                    y: e.touches[0].clientY - rect.top
                };
            } else {
                return {
                    x: e.clientX - rect.left,
                    y: e.clientY - rect.top
                };
            }
        }

        // 開始刮
        function startDrawing(e) {
            isDrawing = true;
            scratch(e);
        }

        // 結束刮
        function stopDrawing() {
            isDrawing = false;
            ctx.beginPath(); // 重置路徑
        }

        // 刮除的動作 (Destination-out 會將畫過的地方變透明)
        function scratch(e) {
            if (!isDrawing) return;
            e.preventDefault(); // 防止手機螢幕滾動
            const pos = getCoordinates(e);
            ctx.globalCompositeOperation = 'destination-out';
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(pos.x, pos.y);
        }

        // 綁定滑鼠與觸控事件 (支援手機與電腦)
        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', scratch);
        canvas.addEventListener('mouseup', stopDrawing);
        canvas.addEventListener('mouseleave', stopDrawing);

        canvas.addEventListener('touchstart', startDrawing, { passive: false });
        canvas.addEventListener('touchmove', scratch, { passive: false });
        canvas.addEventListener('touchend', stopDrawing);
        
        // 處理視窗大小改變時的防呆 (選用)
        window.addEventListener('resize', () => {
            const oldContent = ctx.getImageData(0, 0, canvas.width, canvas.height);
            canvas.width = container.offsetWidth;
            canvas.height = container.offsetHeight;
            ctx.putImageData(oldContent, 0, 0);
            ctx.lineWidth = Math.min(canvas.width, canvas.height) * 0.15;
        });
    </script>
</body>
</html>
